name: flutter_first_app_vsc
description: "AthleteHub — baseball performance tracking for players (stats, Scout ranks, Zuno)."
publish_to: 'none'

version: 1.0.2+8

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  flutter_local_notifications: ^22.3.1
  pdf: ^3.11.0
  google_fonts: ^8.2.1
  shared_preferences: ^2.2.2
  intl: ^0.20.0
  provider: ^6.1.2
  path_provider: ^2.1.2
  fl_chart: ^1.2.0
  image_picker: ^1.0.4
  http: ^1.1.0
  # JSON serialization dependencies
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  smooth_page_indicator: ^3.0.0
  in_app_purchase: ^3.2.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.1
  flutter_markdown_plus: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Build dependencies for code generation
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
